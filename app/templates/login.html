{% extends "base.html" %}

{% block title %}Sign In — Secure File Transfer System{% endblock %}

{% block content %}
<div class="min-h-[75vh] flex flex-col justify-center items-center">
  <div class="w-full max-w-md">
    
    <!-- Header Card Banner -->
    <div class="text-center mb-8">
      <div class="inline-flex p-3 bg-blue-600/10 border border-blue-500/20 rounded-2xl text-blue-400 mb-3 shadow-inner">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
        </svg>
      </div>
      <h2 class="text-2xl font-bold tracking-tight text-white">Welcome Back</h2>
      <p class="text-sm text-slate-400 mt-1">Authenticate to access your encrypted transmissions</p>
    </div>

    <!-- Alert Box for Friendly Messages -->
    <div id="alertBox" class="hidden mb-6 p-4 rounded-lg text-sm border font-medium transition-all duration-200"></div>

    <!-- Card Form -->
    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-8 shadow-xl shadow-black/40">
      <form id="loginForm" onsubmit="submitLogin(event)" class="space-y-5">
        <div>
          <label for="username" class="block text-xs font-semibold uppercase tracking-wider text-slate-300 mb-2">Username</label>
          <div class="relative">
            <input
              type="text"
              id="username"
              name="username"
              required
              autocomplete="username"
              placeholder="e.g. alice"
              class="w-full px-4 py-2.5 rounded-lg bg-slate-950 border border-slate-700 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition"
            >
          </div>
        </div>

        <div>
          <div class="flex items-center justify-between mb-2">
            <label for="password" class="block text-xs font-semibold uppercase tracking-wider text-slate-300">Password</label>
          </div>
          <div class="relative">
            <input
              type="password"
              id="password"
              name="password"
              required
              autocomplete="current-password"
              placeholder="••••••••"
              class="w-full px-4 py-2.5 rounded-lg bg-slate-950 border border-slate-700 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition"
            >
          </div>
        </div>

        <button
          type="submit"
          id="submitBtn"
          class="w-full py-2.5 px-4 rounded-lg bg-blue-600 hover:bg-blue-500 text-white font-semibold text-sm shadow-lg shadow-blue-600/30 transition duration-150 flex items-center justify-center space-x-2"
        >
          <span>Authenticate & Enter</span>
        </button>
      </form>

      <div class="mt-6 pt-6 border-t border-slate-800/80 text-center text-xs text-slate-400">
        Need an account?
        <a href="/register" class="text-blue-400 hover:text-blue-300 font-semibold underline underline-offset-4 ml-1">Create one now</a>
      </div>
    </div>
  </div>
</div>

<script>
  async function submitLogin(e) {
    e.preventDefault();
    const alertBox = document.getElementById('alertBox');
    const submitBtn = document.getElementById('submitBtn');
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;

    alertBox.className = 'hidden';
    submitBtn.disabled = true;
    submitBtn.innerHTML = `<span>Verifying credentials...</span>`;

    try {
      const response = await fetch('/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });

      const data = await response.json();

      if (response.ok) {
        alertBox.className = 'mb-6 p-4 rounded-lg text-sm bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 flex items-center';
        alertBox.innerHTML = `
          <svg class="w-5 h-5 mr-2 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
          </svg>
          <span>Login successful! Opening dashboard...</span>
        `;
        setTimeout(() => {
          window.location.href = '/dashboard';
        }, 600);
      } else {
        alertBox.className = 'mb-6 p-4 rounded-lg text-sm bg-rose-500/10 border border-rose-500/30 text-rose-400 flex items-center';
        // Extract friendly error message without raw JSON
        const errorMsg = data.detail || 'Invalid username or password. Please try again.';
        alertBox.innerHTML = `
          <svg class="w-5 h-5 mr-2 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
          </svg>
          <span>${errorMsg}</span>
        `;
        submitBtn.disabled = false;
        submitBtn.innerHTML = `<span>Authenticate & Enter</span>`;
      }
    } catch (err) {
      alertBox.className = 'mb-6 p-4 rounded-lg text-sm bg-rose-500/10 border border-rose-500/30 text-rose-400 flex items-center';
      alertBox.innerHTML = `<span>Unable to connect to the authentication server. Please check your network.</span>`;
      submitBtn.disabled = false;
      submitBtn.innerHTML = `<span>Authenticate & Enter</span>`;
    }
  }
</script>
{% endblock %}
